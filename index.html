<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tugas Jaringan</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .box {
            width: 360px;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            margin-bottom: 30px;
            color: #777;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        #welcomePage {
            display: none;
        }

        .welcome-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .welcome-text {
            color: #666;
            margin-bottom: 25px;
        }

        #userEmail {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 25px;
        }

        .logout-btn {
            background: #e74c3c;
        }

        .logout-btn:hover {
            background: #c0392b;
        }
    </style>
</head>

<body>

<!-- HALAMAN LOGIN -->
<div class="box" id="loginPage">

    <h1>Login</h1>

    <p class="subtitle">
        Silakan masuk ke akun Anda
    </p>

    <form id="loginForm">

        <div class="input-group">
            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Masukkan email"
                required
            >
        </div>

        <div class="input-group">
            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Masukkan password"
                required
            >
        </div>

        <button type="submit">
            Login
        </button>

        <div id="message"></div>

    </form>

</div>


<!-- HALAMAN SELAMAT DATANG -->
<div class="box" id="welcomePage">

    <div class="welcome-icon">
        👋
    </div>

    <h1>
        Selamat Datang!
    </h1>

    <p class="welcome-text">
        Kamu berhasil login ke sistem.
    </p>

    <p id="userEmail"></p>

    <button
        class="logout-btn"
        id="logoutButton">
        Logout
    </button>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    // DATA SUPABASE
    const SUPABASE_URL =
        "https://kmzpxvhqgbzmvepescsq.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_mWiJNmTUuOSoOGVrt_UpfQ_V3-i-2CG";

    const { createClient } = supabase;

    const supabaseClient = createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    // ELEMENT HALAMAN
    const loginPage =
        document.getElementById("loginPage");

    const welcomePage =
        document.getElementById("welcomePage");

    const loginForm =
        document.getElementById("loginForm");

    const message =
        document.getElementById("message");

    const userEmail =
        document.getElementById("userEmail");

    const logoutButton =
        document.getElementById("logoutButton");


    // FUNGSI MENAMPILKAN HALAMAN WELCOME
    function showWelcome(user) {

        loginPage.style.display = "none";
        welcomePage.style.display = "block";

        userEmail.textContent =
            user.email;
    }


    // FUNGSI MENAMPILKAN LOGIN
    function showLogin() {

        loginPage.style.display = "block";
        welcomePage.style.display = "none";
    }


    // PROSES LOGIN
    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            message.textContent =
                "Sedang login...";


            const { data, error } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,
                    password: password

                });


            if (error) {

                message.textContent =
                    "Login gagal: " + error.message;

                return;
            }


            // LOGIN BERHASIL
            message.textContent = "";

            showWelcome(data.user);

        }
    );


    // PROSES LOGOUT
    logoutButton.addEventListener(
        "click",
        async function() {

            await supabaseClient.auth.signOut();

            showLogin();

        }
    );


    // CEK SESSION SAAT HALAMAN DIBUKA
    async function checkSession() {

        const { data } =
            await supabaseClient.auth.getSession();

        if (data.session) {

            showWelcome(
                data.session.user
            );

        } else {

            showLogin();

        }
    }


    // JALANKAN CEK SESSION
    checkSession();

</script>

</body>
</html>
